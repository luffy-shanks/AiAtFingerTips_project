<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <defs>
    <style>
      .logo-text {
        font-family: 'Arial', sans-serif;
        font-weight: 900;
        font-size: 160px;
        fill: #E61B23;
        letter-spacing: -5px;
      }
      .thin-text {
        font-weight: 300;
      }
    </style>
  </defs>
  <g transform="translate(200, 400) rotate(-90)">
    <text x="0" y="-40" text-anchor="middle" class="logo-text"><tspan class="thin-text">Diet</tspan> Coke</text>
  </g>
</svg>
